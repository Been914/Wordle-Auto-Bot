name: Wordle Solver Trial

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      games:
        description: 'Number of games to play'
        default: '10'
      threshold:
        description: 'Minimum wins required to pass'
        default: '7'

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 libpango-1.0-0 libpangocairo-1.0-0 \
            libgtk-3-0t64 fonts-liberation

      - name: Run solver trials (headless)
        env:
          GAME_COUNT: ${{ inputs.games || '10' }}
          WIN_THRESHOLD: ${{ inputs.threshold || '7' }}
        run: node scripts/run-trials.mjs