name: Wordle Solver Trial

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      games:
        description: 'Number of games to play'
        default: '10'
      threshold:
        description: 'Minimum wins required to pass'
        default: '7'

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome system dependencies
        run: npx puppeteer browsers install chrome

      - name: Run solver trials (headless)
        env:
          GAME_COUNT: ${{ inputs.games || '10' }}
          WIN_THRESHOLD: ${{ inputs.threshold || '7' }}
        run: node scripts/run-trials.mjs